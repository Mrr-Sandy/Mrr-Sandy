<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 64" width="1000" height="64" role="img" aria-label="Contact"><style>svg{--ink:#E6E6E6;--mid:#9A9A9A;--line:#2E2E2E;--bg:#0D1117}.ink{fill:var(--ink)}.mid{fill:var(--mid)}.hair { stroke: var(--line); stroke-width: 1; fill: none; }.edge { stroke: var(--ink); stroke-opacity: 0.2; stroke-width: 1; fill: none; }.box { stroke: var(--ink); stroke-width: 1; fill: none; }.chip { stroke: var(--mid); stroke-width: 1; fill: none; }.node { stroke: var(--ink); stroke-width: 1; fill: var(--bg); }.dot { fill: var(--ink); }.sig { stroke: var(--ink); stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-dasharray: 5 200; animation: sig 6s linear infinite; }.pulse { fill: var(--ink); opacity: 0; animation: pulse 6s ease-in-out infinite; }.cell { fill: var(--ink); }.o1 { opacity: 0.07; }.o2 { opacity: 0.18; }.o3 { opacity: 0.42; }.o4 { opacity: 0.88; }.fade { animation: fade 5s ease-in-out infinite; }.typed { animation: type 6s infinite; }.cmove { animation: cmove 6s infinite; }.caret { fill: var(--ink); animation: blink 1s steps(1) infinite; }.loss { stroke: var(--ink); stroke-width: 1.25; fill: none; stroke-dasharray: 100 100; animation: draw 6s ease-out infinite; }.d1 { animation-delay: 0.7s; }.d2 { animation-delay: 1.4s; }.d3 { animation-delay: 2.1s; }.d4 { animation-delay: 2.8s; }.d5 { animation-delay: 3.5s; }.d6 { animation-delay: 4.2s; }@keyframes sig { from { stroke-dashoffset: 5; } to { stroke-dashoffset: -100; } }@keyframes pulse { 0%, 100% { opacity: 0; } 50% { opacity: 0.85; } }@keyframes fade { 0%, 100% { opacity: 0.07; } 50% { opacity: 0.88; } }@keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }@keyframes type {0% { clip-path: inset(-8px 100% -8px 0); animation-timing-function: steps(28, end); }50% { clip-path: inset(-8px 0 -8px 0); }90% { clip-path: inset(-8px 0 -8px 0); animation-timing-function: steps(28, end); }100% { clip-path: inset(-8px 100% -8px 0); }}@keyframes cmove {0% { transform: translateX(0); animation-timing-function: steps(28, end); }50% { transform: translateX(404.6px); }90% { transform: translateX(404.6px); animation-timing-function: steps(28, end); }100% { transform: translateX(0); }}@keyframes draw {0% { stroke-dashoffset: 100; }65%, 90% { stroke-dashoffset: 0; opacity: 1; }100% { stroke-dashoffset: 0; opacity: 0; }}@media (prefers-reduced-motion: reduce) {.sig, .pulse, .fade, .typed, .cmove, .caret, .loss { animation: none; }}</style><defs><path id="m30" d="M483 750Q483 805 522 845Q560 885 614 885Q670 885 710 845Q750 805 750 750Q750 694 710 655Q671 616 614 616Q558 616 520 654Q483 692 483 750ZM616 1360Q475 1360 406 1208Q336 1056 336 745Q336 435 406 283Q475 131 616 131Q758 131 828 283Q897 435 897 745Q897 1056 828 1208Q758 1360 616 1360ZM616 1520Q855 1520 978 1324Q1100 1128 1100 745Q1100 363 978 167Q855 -29 616 -29Q377 -29 255 167Q133 363 133 745Q133 1128 255 1324Q377 1520 616 1520Z"/><path id="m35" d="M207 1493H963V1323H391V956Q434 972 478 980Q521 987 565 987Q797 987 933 850Q1069 713 1069 479Q1069 243 926 107Q784 -29 537 -29Q418 -29 320 -13Q221 3 143 35V240Q235 190 328 166Q421 141 518 141Q685 141 776 229Q866 317 866 479Q866 639 772 728Q679 817 512 817Q431 817 354 798Q277 780 207 743Z"/><path id="m63" d="M1061 57Q987 14 908 -8Q830 -29 748 -29Q488 -29 342 127Q195 283 195 559Q195 835 342 991Q488 1147 748 1147Q829 1147 906 1126Q983 1105 1061 1061V868Q988 933 914 962Q841 991 748 991Q575 991 482 879Q389 767 389 559Q389 352 482 240Q576 127 748 127Q844 127 920 156Q996 186 1061 248Z"/><path id="m6f" d="M616 991Q476 991 404 882Q332 773 332 559Q332 346 404 236Q476 127 616 127Q757 127 829 236Q901 346 901 559Q901 773 829 882Q757 991 616 991ZM616 1147Q849 1147 972 996Q1096 845 1096 559Q1096 272 973 122Q850 -29 616 -29Q383 -29 260 122Q137 272 137 559Q137 845 260 996Q383 1147 616 1147Z"/><path id="m6e" d="M1051 694V0H866V694Q866 845 813 916Q760 987 647 987Q518 987 448 896Q379 804 379 633V0H195V1120H379V952Q428 1048 512 1098Q596 1147 711 1147Q882 1147 966 10