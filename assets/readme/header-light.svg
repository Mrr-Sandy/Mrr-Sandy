<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" role="img" aria-label="Saurabh Singh, known as Sandy. AI/ML developer and MCA student from Dehradun, India. Building products that solve real-world problems."><style>svg{--ink:#0A0A0A;--mid:#6B6B6B;--line:#E5E5E5;--bg:#FFFFFF;--card:#FAFAFA}.sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--ink)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--mid)}.ink{fill:var(--ink)}.mid{fill:var(--mid)}.cp{animation:type 7s steps(50,end) infinite}@keyframes type{0%{width:0}55%{width:700.0px}92%{width:700.0px}100%{width:0}}.caret{fill:var(--ink);animation:cmove 7s steps(50,end) infinite,blink 1s steps(1) infinite}@keyframes cmove{0%{transform:translateX(0)}55%{transform:translateX(700.0px)}92%{transform:translateX(700.0px)}100%{transform:translateX(0)}}@keyframes blink{50%{opacity:0}}</style><rect width="1000" height="270" fill="var(--bg)"/><text x="40" y="62" class="mono" font-size="14" letter-spacing="0.5">sandy / ai-ml developer / mca student / dehradun, india</text><text x="40" y="135" class="sans" font-size="68" font-weight="700" letter-spacing="-1.5">Saurabh Singh</text><defs><clipPath id="c"><rect class="cp" x="40" y="150" width="0" height="44"/></clipPath></defs><g clip-path="url(#c)"><text x="40" y="183" class="sans" font-size="24" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" textLength="700.0" lengthAdjust="spacingAndGlyphs">&gt; building products that solve real-world problems</text></g><rect class="caret" x="42" y="160" width="12" height="28"/><text x="40" y="228" class="mono" font-size="14">MCA, AI &amp; Data Science / Graphic Era University</text><line x1="40" y1="252" x2="960" y2="252" stroke="var(--line)"/></svg>