<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Saurabh Singh, known as Sandy. AI/ML developer and MCA student from Dehradun, India. Building products that solve real-world problems."><style>svg{--ink:#0A0A0A;--mid:#6B6B6B;--line:#E5E5E5;--bg:#FFFFFF}.ink{fill:var(--ink)}.mid{fill:var(--mid)}.hair { stroke: var(--line); stroke-width: 1; fill: none; }.edge { stroke: var(--ink); stroke-opacity: 0.2; stroke-width: 1; fill: none; }.box { stroke: var(--ink); stroke-width: 1; fill: none; }.chip { stroke: var(--mid); stroke-width: 1; fill: none; }.node { stroke: var(--ink); stroke-width: 1; fill: var(--bg); }.dot { fill: var(--ink); }.sig { stroke: var(--ink); stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-dasharray: 5 200; animation: sig 6s linear infinite; }.pulse { fill: var(--ink); opacity: 0; animation: pulse 6s ease-in-out infinite; }.cell { fill: var(--ink); }.o1 { opacity: 0.07; }.o2 { opacity: 0.18; }.o3 { opacity: 0.42; }.o4 { opacity: 0.88; }.fade { animation: fade 5s ease-in-out infinite; }.typed { animation: type 6s infinite; }.cmove { animation: cmove 6s infinite; }.caret { fill: var(--ink); animation: blink 1s steps(1) infinite; }.loss { stroke: var(--ink); stroke-width: 1.25; fill: none; stroke-dasharray: 100 100; animation: draw 6s ease-out infinite; }.d1 { animation-delay: 0.7s; }.d2 { animation-delay: 1.4s; }.d3 { animation-delay: 2.1s; }.d4 { animation-delay: 2.8s; }.d5 { animation-delay: 3.5s; }.d6 { animation-delay: 4.2s; }@keyframes sig { from { stroke-dashoffset: 5; } to { stroke-dashoffset: -100; } }@keyframes pulse { 0%, 100% { opacity: 0; } 50% { opacity: 0.85; } }@keyframes fade { 0%, 100% { opacity: 0.07; } 50% { opacity: 0.88; } }@keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }@keyframes type {0% { clip-path: inset(-8px 100% -8px 0); animation-timing-function: steps(48, end); }50% { clip-path: inset(-8px 0 -8px 0); }90% { clip-path: inset(-8px 0 -8px 0); animation-timing-function: steps(48, end); }100% { clip-path: inset(-8px 100% -8px 0); }}@keyframes cmove {0% { transform: translateX(0); animation-timing-function: steps(48, end); }50% { transform: translateX(520.1px); }90% { transform: translateX(520.1px); animation-timing-function: steps(48, end); }100% { transform: translateX(0); }}@keyframes draw {0% { stroke-dashoffset: 100; }65%, 90% { stroke-dashoffset: 0; opacity: 1; }100% { stroke-dashoffset: 0; opacity: 0; }}@media (prefers-reduced-motion: reduce) {.sig, .pulse, .fade, .typed, .cmove, .caret, .loss { animation: none; }}.cell{fill:url(#hg)}.pc{fill:url(#pg)}</style><defs><linearGradient id="hg" gradientUnits="userSpaceOnUse" x1="868" y1="0" x2="960" y2="0"><stop offset="0" stop-color="#FF7A3D"/><stop offset=".35" stop-color="#F0368A"/><stop offset=".7" stop-color="#8B5CF6"/><stop offset="1" stop-color="#3B82F6"/></linearGradient><linearGradient id="pg" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="270" y2="0"><stop offset="0" stop-color="#FF7A3D"/><stop offset=".35" stop-color="#F0368A"/><stop offset=".7" stop-color="#8B5CF6"/><stop offset="1" stop-color="#3B82F6"/></linearGradient></defs><text class="mid" x="40.0" y="88.0" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace">sandy / ai-ml developer / mca student / dehradun, india</text><text class="ink" x="38.0" y="164.0" font-size="72" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700" letter-spacing="-1.5">Saurabh Singh</text><text class="mid" x="40.0" y="216.0" font-size="24" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace">&gt;</text><g class="ink typed" transform="translate(61.7 216.0)"><text x="0" y="0" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" textLength="520.1" lengthAdjust="spacingAndGlyphs">building products that so