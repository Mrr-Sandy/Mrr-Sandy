<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" width="1000" height="170" role="img" aria-label="GitHub stats"><style>svg{--ink:#E6E6E6;--mid:#9A9A9A;--line:#2E2E2E;--bg:#0D1117}.ink{fill:var(--ink)}.mid{fill:var(--mid)}.hair { stroke: var(--line); stroke-width: 1; fill: none; }.edge { stroke: var(--ink); stroke-opacity: 0.2; stroke-width: 1; fill: none; }.box { stroke: var(--ink); stroke-width: 1; fill: none; }.chip { stroke: var(--mid); stroke-width: 1; fill: none; }.node { stroke: var(--ink); stroke-width: 1; fill: var(--bg); }.dot { fill: var(--ink); }.sig { stroke: var(--ink); stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-dasharray: 5 200; animation: sig 6s linear infinite; }.pulse { fill: var(--ink); opacity: 0; animation: pulse 6s ease-in-out infinite; }.cell { fill: var(--ink); }.o1 { opacity: 0.07; }.o2 { opacity: 0.18; }.o3 { opacity: 0.42; }.o4 { opacity: 0.88; }.fade { animation: fade 5s ease-in-out infinite; }.typed { animation: type 6s infinite; }.cmove { animation: cmove 6s infinite; }.caret { fill: var(--ink); animation: blink 1s steps(1) infinite; }.loss { stroke: var(--ink); stroke-width: 1.25; fill: none; stroke-dasharray: 100 100; animation: draw 6s ease-out infinite; }.d1 { animation-delay: 0.7s; }.d2 { animation-delay: 1.4s; }.d3 { animation-delay: 2.1s; }.d4 { animation-delay: 2.8s; }.d5 { animation-delay: 3.5s; }.d6 { animation-delay: 4.2s; }@keyframes sig { from { stroke-dashoffset: 5; } to { stroke-dashoffset: -100; } }@keyframes pulse { 0%, 100% { opacity: 0; } 50% { opacity: 0.85; } }@keyframes fade { 0%, 100% { opacity: 0.07; } 50% { opacity: 0.88; } }@keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }@keyframes type {0% { clip-path: inset(-8px 100% -8px 0); animation-timing-function: steps(28, end); }50% { clip-path: inset(-8px 0 -8px 0); }90% { clip-path: inset(-8px 0 -8px 0); animation-timing-function: steps(28, end); }100% { clip-path: inset(-8px 100% -8px 0); }}@keyframes cmove {0% { transform: 